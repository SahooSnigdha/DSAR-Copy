metadata:
  title: Master Data Classifiers Ruleset
  revision: 1
  revision_id: rev-001
  ruleset_version: 1.0.0
  created_at: '2026-10-16T13:30:00Z'
  created_by: Human Admin
  approval_actor: ADMIN-ROOT-001
